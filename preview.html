    function BookingView({ selectedCourseId, setActiveTab }) {
      const [fullName, setFullName] = useState('');
      const [phone, setPhone] = useState('');

      const [courseId, setCourseId] = useState(selectedCourseId || COURSES_DATA[0].id);

      const [errors, setErrors] = useState({});
      const [ticket, setTicket] = useState(null);

      const validate = () => {
        const errs = {};
        if (!fullName.trim()) errs.fullName = 'Vui lòng nhập họ và tên';
        if (!phone.trim()) {
          errs.phone = 'Vui lòng nhập số điện thoại';
        } else if (!/^(0[3|5|7|8|9])[0-9]{8}$/.test(phone.replace(/\s+/g, ''))) {
          errs.phone = 'Số điện thoại Việt Nam gồm 10 số (VD: 0912345678)';
        }
        if (!email.trim()) {
          errs.email = 'Vui lòng nhập email';
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          errs.email = 'Email không hợp lệ (VD: hocvien@gmail.com)';
        }
        setErrors(errs);
        return Object.keys(errs).length === 0;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!validate()) return;

        const reg = {
          bookingCode: 'APEX-REG-' + Math.floor(100000 + Math.random() * 900000),
          fullName,
          phone,
          email,
          courseTitle: COURSES_DATA.find(c => c.id === courseId)?.title || 'Khóa học Pickleball',
          coursePrice: COURSES_DATA.find(c => c.id === courseId)?.price || 0,
          date: new Date().toLocaleDateString('vi-VN'),
          status: 'Đã Tiếp Nhận'
        };

        const existing = JSON.parse(localStorage.getItem('apex_registrations') || '[]');
        existing.unshift(reg);
        localStorage.setItem('apex_registrations', JSON.stringify(existing));

        setTicket(reg);

        }

        const t = {
          ticketCode: 'APEX-COURT-' + Math.floor(100000 + Math.random() * 900000),
          courtName: selectedCourt.name,
          slot: selectedSlot,
          price: price,
          bookerName
        };

        const existing = JSON.parse(localStorage.getItem('apex_court_bookings') || '[]');
        existing.unshift(t);
        localStorage.setItem('apex_court_bookings', JSON.stringify(existing));

        setBookedTicket(t);
      };

      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-8 space-y-8">
          <div className="text-center space-y-2">
            <span className="font-mono text-[10px] uppercase font-bold text-[#2D5E12] bg-[#F1FCDA] px-3 py-1 rounded-full border border-[#D3F592]">
              Hệ thống đặt sân
            </span>
            <h1 className="text-3xl font-extrabold tracking-tight text-[#11181C]">Đặt sân tập Pickleball theo giờ</h1>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            {/* 1. Court List */}
            <div className="space-y-3">
              <h3 className="text-xs font-bold text-[#11181C] uppercase font-mono">1. Chọn sân tập</h3>
              {COURTS_DATA.map(court => (
                <div
                  key={court.id}
                  onClick={() => setSelectedCourt(court)}
                  className={`p-3.5 rounded-2xl border cursor-pointer transition-all ${
                    selectedCourt.id === court.id
                      ? 'bg-white border-[#11181C] shadow-sm'
                      : 'bg-white border-[#E2E6DF] text-[#5A636A] hover:border-[#88929A]'
                  }`}
                >
                  <div className="font-bold text-xs text-[#11181C]">{court.name}</div>
                  <div className="text-[11px] text-[#88929A] mt-0.5">{court.type} • {court.surface}</div>
                  <div className="font-mono text-[11px] text-[#11181C] font-semibold mt-1">
                    Thường: {court.hourlyRateOffPeak.toLocaleString('vi-VN')} đ | Peak: {court.hourlyRatePeak.toLocaleString('vi-VN')} đ
                  </div>
                </div>
              ))}
            </div>

            {/* 2. Slot Picker */}
            <div className="space-y-3">
              <h3 className="text-xs font-bold text-[#11181C] uppercase font-mono">2. Chọn giờ tập</h3>
              <div className="grid grid-cols-2 gap-2">
                {TIME_SLOTS.map(slot => (
                  <button
                    key={slot.id}
                    onClick={() => setSelectedSlot(slot.id)}
                    className={`p-2.5 rounded-xl border text-xs text-center transition-all ${
                      selectedSlot === slot.id
                        ? 'bg-[#11181C] text-white font-bold'
                        : 'bg-white border-[#E2E6DF] text-[#11181C] hover:border-[#11181C]'
                    }`}
                  >
                    <div className="font-mono">{slot.label}</div>
                    <div className={`text-[9px] mt-0.5 ${selectedSlot === slot.id ? 'text-white/80' : 'text-[#88929A]'}`}>
                      {slot.isPeak ? 'Cao điểm' : 'Giờ thường'}
                    </div>
                  </button>
                ))}
              </div>
            </div>

            {/* 3. Confirm Box */}
            <div className="p-6 rounded-3xl bg-white border border-[#E2E6DF] space-y-4 shadow-sm">
              <h3 className="text-xs font-bold text-[#11181C] uppercase font-mono">3. Tóm tắt & Xác nhận</h3>
              
              <div className="space-y-1 text-xs text-[#5A636A] border-b border-[#E2E6DF] pb-3">
                <div><strong>Sân:</strong> {selectedCourt.name}</div>
                <div><strong>Khung giờ:</strong> {selectedSlot} ({selectedSlot >= "17:00" ? 'Cao điểm' : 'Thường'})</div>
                <div className="font-mono text-base font-extrabold text-[#11181C] mt-2">
                  Tổng tiền: {price.toLocaleString('vi-VN')} đ/h
                </div>
              </div>

              {bookedTicket ? (
                <div className="text-center py-4 space-y-2">
                  <div className="text-[#2D5E12] font-bold text-xs bg-[#F1FCDA] py-1 px-3 rounded-full inline-block">✓ Đã giữ sân thành công</div>
                  <div className="font-mono text-xs text-[#11181C]">Mã vé: <strong>{bookedTicket.ticketCode}</strong></div>
                  <button
                    onClick={() => setActiveTab('dashboard')}
                    className="w-full py-2.5 rounded-full bg-[#11181C] text-white text-xs font-medium mt-2"
                  >
                    Xem tại Dashboard
                  </button>
                </div>
              ) : (
                <form onSubmit={handleBook} className="space-y-3">
                  <input
                    type="text"
                    placeholder="Tên người đặt *"
                    value={bookerName}
                    onChange={(e) => setBookerName(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-[#FAFBF9] border border-[#E2E6DF] text-xs text-[#11181C]"
                  />
                  <input
                    type="tel"
                    placeholder="Số điện thoại nhận vé *"
                    value={bookerPhone}
                    onChange={(e) => setBookerPhone(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-[#FAFBF9] border border-[#E2E6DF] text-xs text-[#11181C]"
                  />
                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-full bg-[#11181C] text-white font-medium text-xs hover:bg-[#232C33]"
                  >
                    Giữ sân ngay
                  </button>
                </form>
              )}

            </div>

          </div>
        </div>
      );
    }

    // --- PRO SHOP VIEW ---
    function ShopView({ addToCart }) {
      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-8 space-y-8">
          <div className="text-center space-y-2">
            <span className="font-mono text-[10px] uppercase font-bold text-[#2D5E12] bg-[#F1FCDA] px-3 py-1 rounded-full border border-[#D3F592]">
              Cửa hàng chính hãng
            </span>
            <h1 className="text-3xl font-extrabold tracking-tight text-[#11181C]">Apex Pro Shop Dụng Cụ Pickleball</h1>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            {SHOP_DATA.map(p => (
              <div key={p.id} className="rounded-3xl bg-white border border-[#E2E6DF] overflow-hidden flex flex-col justify-between shadow-sm">
                <div>
                  <img src={p.image} alt={p.name} className="w-full h-44 object-cover" />
                  <div className="p-5 space-y-2">
                    <span className="font-mono text-[9px] text-[#11181C] font-bold px-2 py-0.5 rounded bg-[#FAFBF9] border border-[#E2E6DF]">
                      {p.brand}
                    </span>
                    <h3 className="text-xs font-bold text-[#11181C] tracking-tight">{p.name}</h3>
                    <p className="text-xs text-[#5A636A]">{p.specs}</p>
                  </div>
                </div>

                <div className="p-5 border-t border-[#E2E6DF] flex items-center justify-between">
                  <span className="font-mono text-sm font-extrabold text-[#11181C]">{p.price.toLocaleString('vi-VN')} đ</span>
                  <button
                    onClick={() => addToCart(p)}
                    className="px-3.5 py-1.5 rounded-full bg-[#11181C] text-white text-xs font-medium hover:bg-[#232C33]"
                  >
                    + Thêm
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- BLOG VIEW ---
    function BlogView() {
      return (
        <div className="max-w-5xl mx-auto px-4 sm:px-8 space-y-8">
          <div className="text-center space-y-2">
            <span className="font-mono text-[10px] uppercase font-bold text-[#2D5E12] bg-[#F1FCDA] px-3 py-1 rounded-full border border-[#D3F592]">
              Cẩm nang luật chơi
            </span>
            <h1 className="text-3xl font-extrabold tracking-tight text-[#11181C]">Cẩm nang luật chơi & Chiến thuật</h1>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {BLOG_DATA.map(b => (
              <div key={b.id} className="rounded-3xl bg-white border border-[#E2E6DF] overflow-hidden p-5 space-y-3 shadow-sm">
                <img src={b.image} alt={b.title} className="w-full h-36 object-cover rounded-2xl" />
                <span className="font-mono text-[9px] text-[#2D5E12] font-bold bg-[#F1FCDA] px-2 py-0.5 rounded">{b.category}</span>
                <h3 className="text-xs font-bold text-[#11181C] tracking-tight">{b.title}</h3>
                <p className="text-xs text-[#5A636A] leading-relaxed">{b.summary}</p>
                <div className="text-[11px] text-[#88929A] pt-2 border-t border-[#E2E6DF]">Tác giả: {b.author}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- ABOUT VIEW ---
    function AboutView() {
      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-8 space-y-10">
          <div className="text-center max-w-2xl mx-auto space-y-2">
            <span className="font-mono text-[10px] uppercase font-bold text-[#2D5E12] bg-[#F1FCDA] px-3 py-1 rounded-full border border-[#D3F592]">
              Về chúng tôi
            </span>
            <h1 className="text-3xl font-extrabold tracking-tight text-[#11181C]">Giới thiệu & Bản đồ vị trí</h1>
            <p className="text-xs text-[#5A636A]">Lịch sử hình thành học viện, bản đồ vị trí và kênh phản hồi trực tuyến</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
            <div className="p-6 rounded-3xl bg-white border border-[#E2E6DF] space-y-4 shadow-sm">
              <h3 className="text-base font-bold text-[#11181C] tracking-tight">Lịch sử hình thành học viện</h3>
              <p className="text-xs text-[#5A636A] leading-relaxed">
                Thành lập năm 2021 tại Hà Nội, Apex Pickleball Academy là đơn vị tiên phong chuẩn hóa giáo trình huấn luyện theo hiệp hội IPTPA Hoa Kỳ. Qua 5 năm hoạt động, học viện đã đào tạo trên 1.200 học viên phong trào và VĐV thi đấu các giải lớn.
              </p>
              
              <div className="pt-2 space-y-2 text-xs text-[#5A636A]">
                <div>📍 <strong>Trụ sở:</strong> 18 Hoàng Cầu, Đống Đa, Hà Nội</div>
                <div>📞 <strong>Hotline:</strong> 0988.688.999 (24/7)</div>
                <div>✉️ <strong>Email:</strong> contact@apexpickleball.vn</div>
                <div>🕒 <strong>Giờ mở cửa:</strong> 06:00 - 22:30 hàng ngày</div>
              </div>
            </div>

            <div className="rounded-3xl overflow-hidden border border-[#E2E6DF] h-80 shadow-sm">
              <iframe
                title="Apex Map"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3724.288258380295!2d105.82361667591322!3d21.021149787042577!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ab769e59d48b%3A0xe103e30f135bfa3a!2zSG_DoG5nIEPhuqd1LCDEkOG7kW5nIMSQYSwgSMOgIE7hu5lpLCBWaWV0bmFt!5e0!3m2!1sen!2s!4v1710000000000!5m2!1sen!2s"
                width="100%"
                height="100%"
                style={{ border: 0 }}
                loading="lazy"
              />
            </div>
          </div>
        </div>
      );
    }

    // --- DASHBOARD VIEW ---
    function DashboardView({ user, setActiveTab }) {
      const regs = JSON.parse(localStorage.getItem('apex_registrations') || '[]');
      const courts = JSON.parse(localStorage.getItem('apex_court_bookings') || '[]');

      return (
        <div className="max-w-5xl mx-auto px-4 sm:px-8 space-y-8">
          <div className="p-6 rounded-3xl bg-white border border-[#E2E6DF] flex items-center justify-between shadow-sm">
            <div>
              <h2 className="text-xl font-bold tracking-tight text-[#11181C]">Cổng Quản Lý Học Viên Apex</h2>
              <p className="text-xs text-[#5A636A] mt-1 font-mono">Xin chào {user ? user.name : 'Học Viên'} • DUPR: 3.2 ACTIVE</p>
            </div>
            <button
              onClick={() => setActiveTab('booking')}
              className="px-4 py-2 rounded-full bg-[#11181C] text-white text-xs font-medium hover:bg-[#232C33]"
            >
              Đăng Ký Thêm Khóa
            </button>
          </div>

          <div className="space-y-3">
            <h3 className="text-xs font-bold text-[#11181C] uppercase font-mono">Khóa học đã ghi danh ({regs.length})</h3>
            {regs.map((r, i) => (
              <div key={i} className="p-4 rounded-2xl bg-white border border-[#E2E6DF] flex items-center justify-between text-xs shadow-sm">
                <div>
                  <span className="font-mono text-[#11181C] font-bold">{r.bookingCode}</span>
                  <div className="font-bold text-[#11181C] mt-1">{r.courseTitle}</div>
                  <div className="text-[#5A636A] mt-0.5">Học viên: {r.fullName} • {r.phone}</div>
                </div>
                <div className="text-right">
                  <span className="font-mono text-[#11181C] font-bold block">{r.coursePrice?.toLocaleString('vi-VN')} đ</span>
                  <span className="font-mono text-[10px] text-[#2D5E12] bg-[#F1FCDA] px-2 py-0.5 rounded">{r.status || 'Đã Tiếp Nhận'}</span>
                </div>
              </div>
            ))}
          </div>

          <div className="space-y-3">
            <h3 className="text-xs font-bold text-[#11181C] uppercase font-mono">Lịch đặt sân của bạn ({courts.length})</h3>
            {courts.map((c, i) => (
              <div key={i} className="p-4 rounded-2xl bg-white border border-[#E2E6DF] flex items-center justify-between text-xs shadow-sm">
                <div>
                  <span className="font-mono text-[#11181C] font-bold">{c.ticketCode}</span>
                  <div className="font-bold text-[#11181C] mt-1">{c.courtName}</div>
                  <div className="text-[#5A636A] mt-0.5">Giờ: {c.slot || c.slots}</div>
                </div>
                <div className="text-right">
                  <span className="font-mono text-[#11181C] font-bold block">{c.price?.toLocaleString('vi-VN') || c.totalAmount?.toLocaleString('vi-VN')} đ</span>
                  <span className="font-mono text-[10px] text-[#2D5E12] bg-[#F1FCDA] px-2 py-0.5 rounded">Đã Giữ Sân</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
